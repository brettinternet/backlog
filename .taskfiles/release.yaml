---
version: "3"

tasks:
  snapshot:
    desc: Build all release targets locally without publishing
    cmd: mise exec go -- python3 scripts/release build --version snapshot

  build:
    desc: Build release archives and checksums for VERSION
    requires:
      vars: [VERSION]
    env:
      RELEASE_VERSION: '{{.VERSION}}'
    cmd: mise exec go -- python3 scripts/release build --version "$RELEASE_VERSION"

  test:
    desc: Verify CI gating and installer integrity with local fixtures
    cmd: mise exec powershell -- python3 -B -m unittest discover -s scripts -p 'test_release.py'
