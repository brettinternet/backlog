---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Native state and claim handles always resolve from the primary checkout.
version: "3"

vars:
  CONTROL_ROOT:
    sh: git worktree list --porcelain | sed -n '1s/^worktree //p'

tasks:
  test:
    desc: Verify the primary-only CLI build boundary
    cmd: mise exec -- python3 -B -m unittest discover -s scripts -p 'test_backlog_cli.py'

  cli:
    desc: "Run committed primary main's bl: task backlog:cli -- show BL-12"
    dir: "{{.CONTROL_ROOT}}"
    cmd: mise exec -- python3 scripts/backlog-cli {{.CLI_ARGS}}

  claim:
    desc: "Run Worklease from the primary checkout: task backlog:claim -- release -s SESSION"
    dir: "{{.CONTROL_ROOT}}"
    cmd: mise exec -- worklease {{.CLI_ARGS}}

  claim-next:
    desc: "Claim the first unclaimed ready native item: task backlog:claim-next -- SESSION"
    dir: "{{.CONTROL_ROOT}}"
    cmd: mise exec -- python3 scripts/backlog-claim-next {{.CLI_ARGS}}

  next:
    desc: Show the first ready native item (read-only)
    dir: "{{.CONTROL_ROOT}}"
    silent: true
    cmd: mise exec -- python3 scripts/backlog-cli next
