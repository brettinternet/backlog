[changelog]
header = """
# Changelog

Notable changes to bl are documented here. This file is generated from conventional commits by [git-cliff](https://git-cliff.org/).
"""
body = """
{% if version %}\
## [{{ version }}](https://github.com/brettinternet/backlog/{% if previous.version %}compare/{{ previous.version }}...{{ version }}{% else %}commits/{{ version }}{% endif %}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group }}
{% for commit in entry.commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true
format = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
sort_commits = "newest"
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
  { message = "(?i)^[a-z]+(\\([^)]*\\))?!?: merge ", skip = true },
  { message = "(?i)^docs.*backlog", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^revert", group = "Reverted" },
  { message = ".*", skip = true },
]
