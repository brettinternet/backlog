---
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Require passing CI for the exact tag commit
        run: python3 scripts/release gate
      - name: Build static archives and checksums
        run: task release:build VERSION="$RELEASE_TAG"
      - name: Generate release notes
        run: git-cliff --current --strip header --output dist/notes.md
      - name: Recheck CI and publish
        run: |
          python3 scripts/release gate
          # A -PRERELEASE tag must not become the installer's latest release.
          case "$RELEASE_TAG" in *-*) set -- --prerelease ;; esac
          gh release create "$RELEASE_TAG" "$@" --verify-tag --title "$RELEASE_TAG" --notes-file dist/notes.md dist/bl_*.tar.gz dist/bl_*.zip dist/checksums.txt
