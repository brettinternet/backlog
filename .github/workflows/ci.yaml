---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFLAGS: -count=1

jobs:
  ci:
    name: Go CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      # Fixtures and golden files are byte-exact.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        # Windows needs only Go and Worklease.
        with:
          install_args: ${{ runner.os == 'Windows' && 'go github:brettinternet/worklease' || '' }}

      - name: Resolve Go cache settings
        id: go-cache
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "modules=$(go env GOMODCACHE)"
            echo "staticcheck=$(dirname "$(go env GOCACHE)")/staticcheck"
            echo "key=${RUNNER_OS}-${RUNNER_ARCH}-go-$(go env GOVERSION)-${{ hashFiles('go.sum') }}"
          } >> "$GITHUB_OUTPUT"

      # An exact restore-key match beats a prefix match, so every restore key
      # must be a prefix of saved keys only.
      - name: Restore Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.staticcheck }}
          key: ${{ steps.go-cache.outputs.key }}-${{ github.sha }}
          restore-keys: ${{ steps.go-cache.outputs.key }}-

      # Linux runs the full gate (task ci). The race run covers the plain test
      # run. macOS and Windows run only the Go tests for their platform code.
      - name: Security
        if: runner.os == 'Linux'
        run: task security
      - name: Checks
        if: runner.os == 'Linux'
        run: task check
      - name: Script tests
        if: runner.os == 'Linux'
        run: task test:scripts
      - name: Race detection
        if: runner.os == 'Linux'
        run: task race
      - name: Smoke test
        if: runner.os == 'Linux'
        run: task smoke
      - name: Tests
        if: runner.os == 'macOS'
        run: task cli:test
      - name: Tests
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Coordination tests
        if: runner.os == 'Windows'
        run: BL_PROVIDER_TESTS=1 go test -run Provider ./internal/cli ./internal/worklease

      # Cache entries are immutable; main saves one per commit and pull requests reuse them.
      - name: Save Go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.staticcheck }}
          key: ${{ steps.go-cache.outputs.key }}-${{ github.sha }}
