version: 1
coordination:
    worklease: {}
project:
    id: github.com/brettinternet/backlog
    name: backlog
sources:
    - id: tasks
      type: native
      path: backlog
      prefix: BL
statuses:
    - key: draft
      name: Draft
      category: backlog
    - key: todo
      name: To Do
      category: todo
    - key: in-progress
      name: In Progress
      category: active
    - key: done
      name: Done
      category: done
workflow:
    start: in-progress
    done: done
milestones:
    - key: m-0
      name: Foundation
      description: Native format, project/config, the agent CLI, next, check, import, cache, benchmarks, and bl instructions. Ends by moving this repository's own backlog onto bl (BL-26). See docs/design.md §13.
    - key: m-1
      name: TUI
      description: Stack spike, engine snapshots and projections, list/detail/board/tree layouts, filters and views, editing, go-to and palette, and performance/soak verification against docs/design.md §11. See docs/tui.md.
    - key: m-2
      name: Agents and automation
      description: MCP, events, trust and doctor, hooks, actions, Worklease claims, and Git auto-commit. See docs/design.md §7-§9.
    - key: m-3
      name: Backends
      description: Sync framework, Backlog.md, Beads, GitHub Issues, Linear, Jira Cloud, the external adapter protocol, and workspaces. See docs/design.md §10.
    - key: m-4
      name: Release and adoption
      description: Release pipeline, user documentation, and migrating the owner's other repositories onto bl.
labels:
    - format
    - model
    - config
    - cli
    - engine
    - query
    - readiness
    - tui
    - perf
    - agents
    - mcp
    - events
    - hooks
    - worklease
    - git
    - cache
    - source
    - backlog-md
    - beads
    - github
    - linear
    - jira
    - external
    - import
    - security
    - docs
    - tooling
    - release
    - spike
    - windows
    - human
    - blocked
    - deferred
    - escalated
ready:
    statuses:
        - todo
    satisfiedBy:
        - done
    excludeLabels:
        - blocked
        - deferred
        - escalated
        - human
    skipContainers: true
defaults:
    dod:
        - task ci passes on the final commit
        - Every checked acceptance criterion has --evidence naming the verification command and its result
        - Substantial changes had an independent verifier pass that returned PASS for every acceptance criterion
        - The diff stays within the task's modified-file list, or Implementation Notes justify the deviation
        - No test was deleted, skipped, or weakened
        - User-visible behavior changes are reflected in README.md or docs/ in the same change
