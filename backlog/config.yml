project_name: "backlog"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: ["format", "model", "config", "cli", "engine", "query", "readiness", "tui", "perf", "agents", "mcp", "events", "hooks", "worklease", "git", "cache", "source", "backlog-md", "beads", "github", "linear", "jira", "external", "import", "security", "docs", "tooling", "release", "spike", "human", "blocked", "deferred", "escalated"]
definition_of_done: ["task ci passes on the final commit", "Every checked acceptance criterion has an AC#N evidence line in Implementation Notes naming the command and its result", "Substantial changes had an independent verifier pass that returned PASS for every acceptance criterion", "The diff stays within the task's modified-file list, or Implementation Notes justify the deviation", "No test was deleted, skipped, or weakened", "User-visible behavior changes are reflected in README.md or docs/ in the same change"]
date_format: yyyy-mm-dd
max_column_width: 40
default_editor: "nvim"
auto_open_browser: false
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "BL"
